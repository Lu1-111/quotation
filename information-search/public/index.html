<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知乎信息搜索</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script>
</head>
<body><main>
  <header><p class="eyebrow">报价 · 信息搜索模块</p><h1>知乎信息搜索</h1><p>通过官方接口召回内容，再按关键词与标签词筛选。</p></header>
  <p id="status" class="notice" role="status">正在检查服务…</p>
  <form id="search-form">
    <label>查询语句<input name="query" placeholder="例如：RAG 评测方法" maxlength="240"></label>
    <div class="columns"><label>关键词<input name="keywords" placeholder="多个词用逗号分隔，如 RAG, 评测"></label><label>标签词<input name="tags" placeholder="例如：人工智能, 知识库"></label></div>
    <p class="hint">标签词只匹配标题和摘要，不是知乎原生话题标签。至少填写一种搜索条件。</p>
    <div class="columns"><label>关键词匹配<select name="keywordMode"><option value="any">任意一个</option><option value="all">全部</option></select></label><label>标签词匹配<select name="tagMode"><option value="any">任意一个</option><option value="all">全部</option></select></label></div>
    <div class="columns"><label>单查询数量<input name="countPerQuery" type="number" min="1" max="10" value="10" required></label><label>查询预算（最多调用次数）<input name="maxQueries" type="number" min="1" max="6" value="4" required></label></div>
    <fieldset><legend>内容类型（不选表示全部）</legend><label><input type="checkbox" name="contentType" value="answer"> 回答</label><label><input type="checkbox" name="contentType" value="article"> 文章</label><label><input type="checkbox" name="contentType" value="question"> 问题</label></fieldset>
    <label class="inline"><input name="refresh" type="checkbox"> 跳过 5 分钟查询缓存，重新调用官方接口</label>
    <div class="actions"><button id="submit" disabled>开始搜索</button><button type="button" id="cancel" class="secondary" disabled>取消</button></div>
  </form>
  <p id="feedback" class="notice" role="status" hidden></p>
  <section id="result-panel" hidden><div class="result-heading"><h2>搜索结果 <span id="count"></span></h2><div id="exports"><a id="export-json">下载 JSON</a><a id="export-markdown">下载 Markdown</a></div></div>
    <p id="summary"></p><p class="hint">接口返回摘要和精选评论，不代表阅读全文；单查询最多 10 条，没有公开分页参数。</p>
    <details><summary>查看查询计划与缓存情况</summary><ul id="queries"></ul></details><ol id="results"></ol><p id="empty" hidden>本次召回结果中没有符合全部条件的内容，可减少标签词或使用“任意一个”匹配。</p>
  </section>
</main></body></html>
